# pnpm 11 的设置统一放在本文件（不再读 .npmrc 的 node-linker 等键）。
# hoisted 链接模式与 n8n-pkg 一致：dsh 的插件/Profile 系统依赖扁平 node_modules。
nodeLinker: hoisted
confirmModulesPurge: false
publicHoistPattern:
  - '*'
shamefullyHoist: true

# 允许全部依赖的安装/构建脚本（等价于 n8n-pkg 的 allow-scripts=true，也等价于 npm 默认行为）。
# 自动同步上游新版本时无法预知新引入的原生依赖，显式 allowBuilds 名单会导致构建失败。
# 如需收紧供应链策略，可改回显式 allowBuilds 名单并自行维护。
dangerouslyAllowAllBuilds: true

# pnpm 11 默认的发布年龄门禁会拒绝“太新”的依赖，关闭它保证上游发布后立即可同步。
minimumReleaseAge: 0

patchedDependencies:
  '@deepseek-ai/dsh-client-ui-conversation@>=0.2.2-rc.1': patches/@deepseek-ai__dsh-client-ui-conversation@0.2.2-rc.1.patch
  '@deepseek-ai/dsh-client-ui-plugin-manager@>=0.2.2-rc.1': patches/@deepseek-ai__dsh-client-ui-plugin-manager@0.2.2-rc.1.patch
  '@deepseek-ai/dsh-client-ui-renderer@>=0.2.2-rc.1': patches/@deepseek-ai__dsh-client-ui-renderer@0.2.2-rc.1.patch
  '@deepseek-ai/dsh-llm-pi-ai@>=0.2.2-rc.1': patches/@deepseek-ai__dsh-llm-pi-ai@0.2.2-rc.1.patch
  # sharp 在 Electron + Linux 下改用 WebAssembly 副本（见 patches/sharp@0.35.5.patch）；
  # 纯 Node 仍走原生预编译二进制，其它平台/运行时行为不变。
  'sharp@0.35.5': patches/sharp@0.35.5.patch
  # @vscode/ripgrep 1.18.0 只用 CJS require.resolve 定位 rg 二进制；Electron 的 asar
  # 虚拟文件系统让这个路径“存在”却无法 spawn（ENOENT），桌面端的 grep/glob 整体失效
  # （issue #23）。补丁改为优先走 ESM 解析、其次 .asar.unpacked、最后把二进制复制到
  # 临时缓存目录（见 patches/@vscode__ripgrep@1.18.0.patch）；纯 Node 路径不变。
  '@vscode/ripgrep@>=1.18.0': patches/@vscode__ripgrep@1.18.0.patch
