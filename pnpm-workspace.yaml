# pnpm 11 的设置统一放在本文件（不再读 .npmrc 的 node-linker 等键）。
# hoisted 链接模式与 n8n-pkg 一致：dsh 的插件/Profile 系统依赖扁平 node_modules。
nodeLinker: hoisted
confirmModulesPurge: false
publicHoistPattern:
  - '*'
shamefullyHoist: true

# 允许全部依赖的安装/构建脚本（等价于 n8n-pkg 的 allow-scripts=true，也等价于 npm 默认行为）。
# 自动同步上游新版本时无法预知新引入的原生依赖，显式 allowBuilds 名单会导致构建失败。
# 如需收紧供应链策略，可改回显式 allowBuilds 名单并自行维护。
dangerouslyAllowAllBuilds: true

# pnpm 11 默认的发布年龄门禁会拒绝“太新”的依赖，关闭它保证上游发布后立即可同步。
minimumReleaseAge: 0

# 刻意不配 patchedDependencies。
#
# 这里的补丁（patches/*.mjs）不绑定任何 dsh 版本，由
# `node scripts/apply-core-patches.mjs --dir=build_dir` 在 deploy 之后套到产物上。
# 走 pnpm 的 patchedDependencies 就必须写「包名@版本范围」并且提交严格的逐行 diff：
# 上游一发 0.2.2-rc.2（client bundle 被压成单行），install 就直接
# ERR_PNPM_PATCH_FAILED（run 43324486759）。锚点式补丁对版本、压缩都免疫，
# 而且补丁对不上时打包会失败，不会静默跳过。
