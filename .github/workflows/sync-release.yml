name: Sync & Release DeepSeek Harness

# 定期检测 npm 上的 @deepseek-ai/dsh 最新版本；发现新版本后自动调用
# release.yml 构建四个平台并发布 Release。上游 deepseek-ai/deepseek-harness
# 目前不发布 GitHub Release，同步信号以 npm 已发布版本为准：取 semver 最高者
# （覆盖 latest/next 等所有 dist-tag —— 上游可能把新 rc 标在 next 上而 latest
# 仍是旧版），解析逻辑见 scripts/resolve-latest-dsh-version.mjs。
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '手动指定要同步的 dsh 版本（留空自动取 npm 已发布版本中 semver 最高者）'
        required: false
        default: ''
      force:
        description: '即使版本未变化也强制重新构建'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      changed: ${{ steps.resolve.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 要和上一次的发布 tag 比对打包内容，必须能取到那个提交。
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Detect packaging changes
        id: packaging
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 上一次发布的 tag 和当前 main 比一比：打包相关的内容（核心补丁、脚本、
          # 依赖、workflow）变了就重新出包，哪怕 npm 版本没变。
          # 起因：sharp 的 wasm 回退是在 0.2.2-rc.1 发布之后才合进 main 的，而同步
          # 只认 npm 版本，于是那份产物一直发不出去，Linux 上的图片能力全废。
          changed_packaging="false"
          last_tag="$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -z "$last_tag" ]; then
            echo "没有找到已发布的 tag，跳过打包内容比对"
          else
            base="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${last_tag}" --jq '.object.sha' 2>/dev/null || true)"
            if [ -n "$base" ] && [ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${last_tag}" --jq '.object.type' 2>/dev/null || true)" = "tag" ]; then
              base="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${base}" --jq '.object.sha' 2>/dev/null || true)"
            fi
            if [ -z "$base" ]; then
              echo "解析 ${last_tag} 对应的提交失败，跳过打包内容比对"
            else
              files="$(git diff --name-only "${base}..HEAD" -- patches scripts pnpm-workspace.yaml .github/workflows || true)"
              # package.json 只看依赖：同步流程每次发布后都会把自身 version 与
              # @deepseek-ai/dsh 依赖改写并提交，若把它们算进去就会每 6 小时重建一次。
              deps="$(git diff "${base}..HEAD" -- package.json | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v '"version"' | grep -v '"@deepseek-ai/dsh"' || true)"
              if [ -n "$files" ] || [ -n "$deps" ]; then
                changed_packaging="true"
                echo "上次发布（${last_tag}）之后打包相关内容有改动："
                if [ -n "$files" ]; then
                  echo "$files"
                fi
                if [ -n "$deps" ]; then
                  echo "package.json 依赖有改动："
                  echo "$deps"
                fi
              fi
            fi
          fi
          echo "changed=$changed_packaging" >> "$GITHUB_OUTPUT"

      - name: Resolve target version
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 手动指定优先；留空时取 npm 已发布版本中 semver 最高者，
          # 覆盖 latest/next 等所有 dist-tag（见 scripts/resolve-latest-dsh-version.mjs）。
          target="${{ github.event.inputs.version }}"
          if [ -z "$target" ]; then
            target="$(node scripts/resolve-latest-dsh-version.mjs)"
          fi
          echo "target version: $target"

          # 上次 npm 构建发布的版本，从最新的非 pre-release tag
          # `dsh-<version>-<run_id>` 解析；源码 pre-release 不应干扰 npm 同步。
          # 注意：失败尝试留下的 draft 不会被这里看到（draft 在该列表里不可见），
          # 清除这类残留由下面的 stale draft 步骤负责。
          last=""
          if gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' >/tmp/last_release.txt 2>/tmp/last_release.err; then
            tag="$(cat /tmp/last_release.txt)"
            last="${tag#dsh-}"
            last="${last%-*}"
          else
            echo "gh release list failed: $(cat /tmp/last_release.err)"
          fi
          echo "last released version: ${last:-<none>}"

          changed="false"
          if [ "$target" != "$last" ] || [ "${{ github.event.inputs.force }}" = "true" ] || [ "${{ steps.packaging.outputs.changed }}" = "true" ]; then
            changed="true"
          fi
          echo "changed: $changed"

          echo "version=$target" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Clear stale drafts for target version
        # 上一次失败尝试会留下半成品 draft（run 35242697914 就是这样：release
        # 建好了但资产只传了一个）。draft 没有 git ref，只能通过 API 按 draft
        # 列表找到，所以 `last released version` 那一步看不到它。
        # 这里在【构建之前】就清掉，因为每个 run 的 tag 都带自己的 run_id：
        # 不清理的话，本次 run 若是重跑（attempt 2+）就会和 attempt 1 的残留
        # draft 撞车；先清掉，才能保证一个 run 对应一套产物。
        if: ${{ steps.resolve.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/delete-stale-drafts.mjs --prefix="dsh-${{ steps.resolve.outputs.version }}-"

  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/release.yml
    with:
      dsh_version: ${{ needs.sync.outputs.version }}

  # Sync & Release 完成后，把 main 分支上的版本号（@deepseek-ai/dsh 依赖
  # 以及本仓库自身 version）同步为本次同步的版本，并实时推送到 main。
  update-main:
    needs: [sync, build]
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update version on main
        env:
          TARGET: ${{ needs.sync.outputs.version }}
        run: |
          set -euo pipefail
          # 更新 @deepseek-ai/dsh 依赖为本次同步的版本（save-exact）
          npm pkg set "dependencies.@deepseek-ai/dsh=$TARGET"
          # 本仓库自身 version 同步为该版本
          npm version "$TARGET" --no-git-tag-version --allow-same-version
          # 同步 lockfile（--lockfile-only 只重算解析，不构建；allowUnusedPatches 忽略旧版本补丁）
          pnpm install --lockfile-only --ignore-scripts

      - name: Commit and push to main
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "no version changes to commit"
          else
            git add package.json pnpm-lock.yaml
            git commit -m "chore: sync version to ${{ needs.sync.outputs.version }}"
            git push origin main
            echo "pushed version ${{ needs.sync.outputs.version }} to main"
          fi


