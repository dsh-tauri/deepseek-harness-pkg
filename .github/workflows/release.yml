name: Build and Release DeepSeek Harness

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: '要打包的 dsh 版本 (例如: 0.1.2-rc.1 或 latest)'
        required: true
        default: '0.1.2-rc.1'
      existing_release:
        description: '仅为已有 tag 补发 Linux ARM64（不覆盖原资产）'
        required: false
        type: string
  workflow_call:
    inputs:
      dsh_version:
        description: '要打包的 dsh 版本 (例如: 0.1.2-rc.1 或 latest)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # npm 发布后 packument（版本列表）先可见，tarball 可能还要过一会儿才能下。
  # run 35694751348 就是上游 06:23:31Z 发布 0.1.7-alpha.1、sync 06:25:34Z 选中它、
  # 06:25:55Z `pnpm add` 拿到 tarball 404，四个平台的 build 一起白跑。
  # 所以在 fan-out 之前先确认 tarball 真能下：拿不到就有界轮询（默认 10 分钟），
  # 失败也只是一个 job 失败，不占 4 个 runner，且下一个定时 sync 会自然重试。
  preflight:
    name: Verify dsh version is installable
    runs-on: ubuntu-latest
    # 预算覆盖两个探测：tarball 最多等 10 分钟（600s），依赖链最多等 8 分钟（480s），
    # 外加真安装本身的时间（冷 store 约 2-3 分钟）；健康时两者都秒过。
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install pnpm
        # 依赖链探测要真跑一次 `pnpm install`（在临时目录），所以 preflight 也需要 pnpm。
        uses: pnpm/action-setup@v4

      - name: Validate existing release
        if: inputs.existing_release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.existing_release }}
          VERSION: ${{ inputs.dsh_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^dsh-(.+)-[0-9]+$ ]]
          [[ "${BASH_REMATCH[1]}" == "$VERSION" ]]
          gh release view "$TAG" --json isDraft --jq '.isDraft == false' | grep -qx true

      - name: Wait for the npm tarball
        shell: bash
        run: |
          set -euo pipefail
          node scripts/wait-for-npm-version.mjs \
            --package=@deepseek-ai/dsh \
            --version="${{ inputs.dsh_version || github.event.inputs.dsh_version }}" \
            --timeout-seconds=600

      - name: Wait until the whole dependency closure resolves
        # tarball 可下载 != 这一版发全了：上游发布顺序是根包先可见、~150 个子包随后
        # 陆续上架，中间窗口里 lockfile 解析会 ERR_PNPM_NO_MATCHING_VERSION
        # （run 36424634893）。这里在 fan-out 前把完整依赖链试解析一遍。
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-dsh-installable.mjs \
            --package=@deepseek-ai/dsh \
            --version="${{ inputs.dsh_version || github.event.inputs.dsh_version }}" \
            --timeout-seconds=480

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: preflight
    # 与 release job 同理：卡住的步骤不该一直占着 runner 直到 6 小时默认上限。
    timeout-minutes: 45
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.existing_release != '' && '["ubuntu-24.04-arm"]' || '["windows-latest","windows-11-arm","macos-latest","macos-15-intel","ubuntu-latest","ubuntu-24.04-arm"]') }}
    env:
      ARTIFACT_NAME: ${{ fromJSON('{"windows-latest":"deepseek-harness-pkg-windows.zip","windows-11-arm":"deepseek-harness-pkg-windows-arm64.zip","macos-latest":"deepseek-harness-pkg-macos-arm64.zip","macos-15-intel":"deepseek-harness-pkg-macos-x64.zip","ubuntu-latest":"deepseek-harness-pkg-linux.zip","ubuntu-24.04-arm":"deepseek-harness-pkg-linux-arm64.zip"}')[matrix.os] }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 必须与 desktop 捆绑运行时保持一致（src-tauri/src/config/constants.rs 的 NODE_VERSION）。
          # 原生依赖（如 fs-ext）会在构建期编译，ABI 只匹配同一大版本的运行时。
          node-version: 22.22.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Pin dsh version and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm add "@deepseek-ai/dsh@${{ inputs.dsh_version || github.event.inputs.dsh_version }}" --save-exact
          pnpm install

      - name: Deploy package
        shell: bash
        run: |
          set -euo pipefail
          pnpm deploy --filter . --prod build_dir --legacy
          cd build_dir
          npm install --omit=dev

      - name: Report deploy footprint
        shell: bash
        # build_dir 此时是 deploy 后的真实内容。这一步只报告、不删除，用于回答
        # “体积膨胀来自哪个依赖”——保留项很大而可回收项很小，说明原因不在
        # 瘦身规则（例如交叉平台的 node-pty / sharp 原生二进制被打进了每个平台包）。
        run: node scripts/prune-node-modules.mjs --report-only --dir=build_dir/node_modules --list-dir=test --list-dir=__tests__

      - name: Prune node_modules
        shell: bash
        working-directory: build_dir
        # 统一瘦身逻辑收敛到脚本里（跨平台支持），同时打印删除前后的体积构成。
        run: node ../scripts/prune-node-modules.mjs --dir=node_modules

      - name: Verify deployed Linux ARM64 runtime
        if: matrix.os == 'ubuntu-24.04-arm'
        shell: bash
        working-directory: build_dir
        run: |
          set -euo pipefail
          getconf GNU_LIBC_VERSION
          node - <<'JS'
          const assert = require('node:assert/strict')
          assert.equal(process.platform, 'linux')
          assert.equal(process.arch, 'arm64')
          require('koffi')
          require('sharp')
          assert.equal(typeof require('node-pty').spawn, 'function')
          JS
          node node_modules/@deepseek-ai/dsh/lib/bin.js web --help > dsh-web-help.txt
          grep -q 'Serve the DeepSeek Harness browser UI' dsh-web-help.txt

      - name: Verify deployed Windows ARM64 runtime
        if: matrix.os == 'windows-11-arm'
        shell: bash
        working-directory: build_dir
        run: |
          set -euo pipefail
          node - <<'JS'
          const assert = require('node:assert/strict')
          assert.equal(process.platform, 'win32')
          assert.equal(process.arch, 'arm64')
          require('koffi')
          require('sharp')
          assert.equal(typeof require('node-pty').spawn, 'function')
          JS
          node node_modules/@deepseek-ai/dsh/lib/bin.js web --help > dsh-web-help.txt
          grep -q 'Serve the DeepSeek Harness browser UI' dsh-web-help.txt

      - name: Create archive
        shell: bash
        working-directory: build_dir
        run: |
          # 根据不同平台使用对应的压缩命令
          # 只打包真实部署内容；不要加入已移除的 patches 目录。
          # 7z 对缺失路径返回非零退出码，会导致 Windows 打包失败。
          case "${{ matrix.os }}" in
            windows-*)
              7z a ../${{ env.ARTIFACT_NAME }} node_modules package.json package-lock.json
              ;;
            *)
              zip -r ../${{ env.ARTIFACT_NAME }} node_modules package.json package-lock.json
              ;;
          esac

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}

  release:
    needs: build
    runs-on: ubuntu-latest
    # 上传通道退化时 step 会挂着不动（见本文件顶部说明）。旧配置没有超时，
    # 卡住的上传会一直占着 runner 直到 6 小时默认上限，白烧额度。
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.existing_release || format('dsh-{0}-{1}', inputs.dsh_version || github.event.inputs.dsh_version, github.run_id) }}
      EXISTING_RELEASE: ${{ inputs.existing_release }}
      DSH_VERSION: ${{ inputs.dsh_version || github.event.inputs.dsh_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Report artifact sizes
        # 只报告、不拦截。体积暴涨（alpha.1 的 ~156 MiB -> alpha.2 的 ~534 MiB）
        # 来自上游的硬依赖 dsh-office-to-pdf -> @deepseek-ai/libreoffice-kit
        # （Windows 325 MiB 原生引擎 / Linux 185 MiB wasm）：libreoffice-kit 的
        # resolveEngine() 在 Windows/macOS 上强制原生引擎包、没有 wasm 回退，
        # 所以躲不掉，也就不设闸门。把数字打进日志，膨胀仍然可见。
        # 需要定位来源时用：node scripts/zip-footprint.mjs <产物.zip>
        run: |
          set -euo pipefail
          # 这一步按设计「只报告、不拦截」：报表脚本自己崩了（run 35294661283 就是
          # `total is not defined`）不该把整轮发布挡在下游步骤之前。失败降级为一条
          # warning 注解，数字仍然留在日志里；产物是否齐全由上传/校验步骤负责。
          node scripts/check-artifact-size.mjs --dir=./artifacts \
            || echo "::warning::artifact size report failed; see log above"

          previous_tag="$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
          if [ -n "$previous_tag" ]; then
            echo "上一个已发布版本 ${previous_tag} 的资产体积（对比用）:"
            gh release view "$previous_tag" --json assets \
              --jq '.assets[] | "  \(.size)  \(.name)"' || true
          fi

      - name: Delete stale drafts for this version
        if: inputs.existing_release == ''
        # 上一次尝试失败会留下半成品 draft；draft 没有 git ref，既不会被
        # `gh release list --exclude-pre-releases` 看到，也无法用 tag 查到，
        # 必须先清掉，重跑才干净。
        run: node scripts/delete-stale-drafts.mjs --prefix="dsh-${DSH_VERSION}-"

      - name: Create release
        if: inputs.existing_release == ''
        run: |
          set -euo pipefail
          # 不指定 --target，保持与 softprops/action-gh-release 一致的行为
          # （新 tag 落在仓库默认分支上）。tag 一律新建：本次 run 的 tag 尚未
          # 创建，历史 draft 已被上一步删除，所以这里的 tag 不会冲突。
          release_url="$(gh release create "$TAG" \
            --title "Release-${DSH_VERSION}" \
            --notes "$(printf '%s\n' \
              '# DeepSeek Harness Desktop Packages' \
              "- Version: ${DSH_VERSION}" \
              "- Build ID: ${GITHUB_RUN_ID}" \
              '- 使用说明见仓库 README.md')")"
          echo "created release: $release_url"
          {
            echo "### Published release"
            echo
            echo "$release_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assets one by one with retry
        # 串行上传 + 逐包重试，替代 softprops/action-gh-release 的并发上传。
        # 原因有二：
        #   1. 该 action 用 Promise.all 同时传全部资产，并把每个文件整体读进内存
        #      (softprops/action-gh-release#243)；4 条连接平分本已退化的带宽，
        #      每条都更容易卡到 undici 的 5 分钟响应头超时而整体失败。
        #   2. 失败后没有逐包续传，只能整轮重跑。
        # `gh release upload` 是流式单连接上传，且 --clobber 允许重跑覆盖。
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(./artifacts/**/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no assets found under ./artifacts; refusing to publish an empty release" >&2
            exit 1
          fi
          upload_flags=(--clobber)
          if [ -n "$EXISTING_RELEASE" ]; then
            [ "${#assets[@]}" -eq 1 ]
            [ "$(basename "${assets[0]}")" = deepseek-harness-pkg-linux-arm64.zip ]
            upload_flags=()
          fi
          for asset in "${assets[@]}"; do
            attempt=1
            max_attempts=4
            until gh release upload "$TAG" "$asset" "${upload_flags[@]}"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "upload failed after ${max_attempts} attempts: $asset" >&2
                exit 1
              fi
              delay=$((15 * attempt))
              echo "upload failed for $asset (attempt ${attempt}/${max_attempts}), retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
            echo "uploaded $asset"
          done

      - name: Verify release assets
        # 显式确认六个包都在，避免发布出残缺 release。
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.size)  \(.name)"'
          count="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          # 补齐旧 release 时矩阵只构建 Linux ARM64，凑齐后仍是五份。
          if [ -n "$EXISTING_RELEASE" ]; then
            expected=5
          else
            expected=6
          fi
          if [ "$count" -lt "$expected" ]; then
            echo "expected ${expected} assets on ${TAG}, found ${count}" >&2
            exit 1
          fi
          echo "release ${TAG} is complete"
