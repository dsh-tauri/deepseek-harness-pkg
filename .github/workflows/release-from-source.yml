name: Build and Pre-release DeepSeek Harness from Source

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: '上游 GitHub Release 版本（例如: 0.1.2-alpha.1）'
        required: true
  workflow_call:
    inputs:
      dsh_version:
        description: '上游 GitHub Release 版本'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build from source on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 与 release job 同理：卡住的步骤不该一直占着 runner 直到 6 小时默认上限。
    timeout-minutes: 60
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: windows-latest
            artifact_name: deepseek-harness-pkg-windows.zip
          - os: windows-11-arm
            artifact_name: deepseek-harness-pkg-windows-arm64.zip
          - os: macos-latest
            artifact_name: deepseek-harness-pkg-macos-arm64.zip
          - os: macos-15-intel
            artifact_name: deepseek-harness-pkg-macos-x64.zip
          - os: ubuntu-latest
            artifact_name: deepseek-harness-pkg-linux.zip
          - os: ubuntu-24.04-arm
            artifact_name: deepseek-harness-pkg-linux-arm64.zip

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与 desktop 捆绑运行时保持一致（src-tauri/src/config/constants.rs 的 NODE_VERSION），
          # 避免预编译原生模块（fs-ext 等）与运行时 ABI 不匹配。
          node-version: 22.22.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Clone upstream release source
        shell: bash
        env:
          DSH_VERSION: ${{ inputs.dsh_version || github.event.inputs.dsh_version }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "dsh-v${DSH_VERSION}" https://github.com/deepseek-ai/deepseek-harness.git upstream

      - name: Configure shippable upstream node_modules layout
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          # deploy otherwise creates junctions/symlinks that cannot safely move
          # between machines inside a zip archive.
          cat >> pnpm-workspace.yaml <<'EOF'

          nodeLinker: hoisted
          shamefullyHoist: true
          publicHoistPattern:
            - '*'
          EOF

      - name: Install upstream dependencies
        shell: bash
        working-directory: upstream
        run: pnpm install

      - name: Include required runtime-closure peers and regenerate lockfile
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          # The `dsh-python-runtime-closure` deploy root (`python/sdk-runtime`)
          # lists only direct deps. A profile plugin that needs a sibling package
          # solely through peerDependencies (e.g. `dsh-session-title-first-prompt-llm`
          # -> `dsh-session-title-llm`) is NOT pulled into the hoisted deploy, so
          # the shipped closure crashes at boot with ERR_MODULE_NOT_FOUND
          # (`Cannot find package '@deepseek-ai/dsh-session-title-llm'`). Pin the
          # required workspace peers as direct deps of the closure manifest; the
          # regenerate install below bakes them into the lockfile before deploy.
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs'
          const manifest = JSON.parse(readFileSync('python/sdk-runtime/package.json', 'utf8'))
          manifest.dependencies ||= {}
          for (const name of [
            '@deepseek-ai/dsh-session-title-llm',
            '@deepseek-ai/dsh-session-title-first-prompt-llm',
            '@deepseek-ai/dsh-session-title-all-prompts-llm',
            '@deepseek-ai/dsh-util-workspace-path',
            '@deepseek-ai/cordis',
          ]) {
            manifest.dependencies[name] ||= 'workspace:^'
          }
          const sorted = {}
          for (const key of Object.keys(manifest.dependencies).sort()) sorted[key] = manifest.dependencies[key]
          manifest.dependencies = sorted
          writeFileSync('python/sdk-runtime/package.json', JSON.stringify(manifest, null, 2) + '\n')
          JS
          # Regenerate the upstream lockfile so the peers are installed as prod deps.
          pnpm install --no-frozen-lockfile

      - name: Build upstream
        shell: bash
        working-directory: upstream
        env:
          # Official client build profile: without it the client bundles embed no
          # DSH_CLIENT_BUILD_PROFILE / DSH_CLIENT_TITLE, so dsh-client-ui-brand-official
          # bails (`{}.DSH_CLIENT_BUILD_PROFILE !== "official"`) and the sidebar shows
          # the "DSH Local Build" fallback badge instead of the DeepSeek Harness brand.
          # commit/version are auto-filled from the git checkout by scripts/build.ts.
          DSH_BUILD_CLIENT_PROFILE: official
        run: pnpm run build

      - name: Verify upstream runtime closure
        shell: bash
        working-directory: upstream
        run: pnpm run verify-runtime-closure

      - name: Deploy complete upstream runtime closure
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          pnpm deploy --filter dsh-python-runtime-closure --prod build_dir --legacy

      - name: Arrange standalone package and command shim
        shell: bash
        working-directory: upstream/build_dir
        env:
          DSH_VERSION: ${{ inputs.dsh_version || github.event.inputs.dsh_version }}
        run: |
          set -euo pipefail
          mkdir -p node_modules/.bin
          # pnpm may create .bin entries as links to the package target;
          # remove them before writing standalone shims, otherwise writing the
          # shim would overwrite @deepseek-ai/dsh/lib/bin.js itself.
          rm -f node_modules/.bin/dsh node_modules/.bin/dsh.cmd node_modules/.bin/dsh.ps1
          cat > package.json <<EOF
          {
            "name": "deepseek-harness-pkg",
            "version": "${DSH_VERSION}",
            "private": true,
            "description": "Source-built pre-release of DeepSeek Harness"
          }
          EOF

          cat > node_modules/.bin/dsh <<'EOF'
          #!/bin/sh
          basedir=$(dirname "$0")
          exec node "$basedir/../@deepseek-ai/dsh/lib/bin.js" "$@"
          EOF
          chmod +x node_modules/.bin/dsh

          cat > node_modules/.bin/dsh.cmd <<'EOF'
          @ECHO off
          SETLOCAL
          SET "_prog=node"
          "%_prog%" "%~dp0\..\@deepseek-ai\dsh\lib\bin.js" %*
          ENDLOCAL
          EXIT /b %errorlevel%
          EOF

          cat > node_modules/.bin/dsh.ps1 <<'EOF'
          #!/usr/bin/env pwsh
          $basedir = Split-Path $MyInvocation.MyCommand.Definition -Parent
          & node "$basedir/../@deepseek-ai/dsh/lib/bin.js" $args
          exit $LASTEXITCODE
          EOF

      - name: Report deploy footprint
        shell: bash
        working-directory: upstream/build_dir
        # 只报告不删除：用于回答“体积膨胀来自哪个依赖”。保留项很大而可回收项
        # 很小，说明原因不在瘦身规则（例如交叉平台的 node-pty / sharp 原生
        # 二进制被打进了每个平台包）。
        run: node ../../scripts/prune-node-modules.mjs --report-only --dir=node_modules --list-dir=test --list-dir=__tests__

      - name: Verify runtime closure and source-built CLI
        shell: bash
        working-directory: upstream/build_dir
        run: |
          set -euo pipefail
          test -f node_modules/@deepseek-ai/dsh/lib/bin.js
          test -f node_modules/.bin/dsh
          # Required peers are not necessarily pulled by a CLI-only deploy.
          # Keep this exact smoke import to catch the failure seen in desktop.
          test -f node_modules/@deepseek-ai/cordis/package.json
          test -f node_modules/@deepseek-ai/cordis-plugin-group/package.json
          node --input-type=module -e "import('@deepseek-ai/dsh-app-boot').then(() => console.log('runtime closure OK'))"
          # Peer-only deps embedded in a loaded profile plugin are the class of
          # failure the desktop hit (ERR_MODULE_NOT_FOUND on
          # @deepseek-ai/dsh-session-title-llm). Importing the profile plugin
          # exercises its peer resolution; fail loudly if the closure is incomplete.
          node --input-type=module -e "import('@deepseek-ai/dsh-session-title-first-prompt-llm').then(() => console.log('session-title closure OK'))"
          # Exercise the actual shipped launcher, not only a dependency import.
          node node_modules/@deepseek-ai/dsh/lib/bin.js web --help >/tmp/dsh-web-help.txt
          grep -q 'Serve the DeepSeek Harness browser UI' /tmp/dsh-web-help.txt

      - name: Prune node_modules
        shell: bash
        working-directory: upstream/build_dir
        # 统一瘦身逻辑收敛到脚本里（跨平台支持），同时打印删除前后的体积构成。
        run: node ../../scripts/prune-node-modules.mjs --dir=node_modules

      - name: Verify deployed Linux ARM64 runtime
        if: matrix.os == 'ubuntu-24.04-arm'
        shell: bash
        working-directory: upstream/build_dir
        run: |
          set -euo pipefail
          getconf GNU_LIBC_VERSION
          node - <<'JS'
          const assert = require('node:assert/strict')
          assert.equal(process.platform, 'linux')
          assert.equal(process.arch, 'arm64')
          require('koffi')
          require('sharp')
          assert.equal(typeof require('node-pty').spawn, 'function')
          JS
          node node_modules/@deepseek-ai/dsh/lib/bin.js web --help > dsh-web-help.txt
          grep -q 'Serve the DeepSeek Harness browser UI' dsh-web-help.txt

      - name: Verify deployed Windows ARM64 runtime
        if: matrix.os == 'windows-11-arm'
        shell: bash
        working-directory: upstream/build_dir
        run: |
          set -euo pipefail
          node - <<'JS'
          const assert = require('node:assert/strict')
          assert.equal(process.platform, 'win32')
          assert.equal(process.arch, 'arm64')
          require('koffi')
          require('sharp')
          assert.equal(typeof require('node-pty').spawn, 'function')
          JS
          node node_modules/@deepseek-ai/dsh/lib/bin.js web --help > dsh-web-help.txt
          grep -q 'Serve the DeepSeek Harness browser UI' dsh-web-help.txt

      - name: Create archive
        shell: bash
        working-directory: upstream/build_dir
        run: |
          case "${{ matrix.os }}" in
            windows-*)
              7z a ../../${{ matrix.artifact_name }} node_modules package.json
              ;;
            *)
              zip -r ../../${{ matrix.artifact_name }} node_modules package.json
              ;;
          esac

      - name: Create Electron asar
        shell: bash
        # 与 ZIP 同内容的单文件 Electron 资源。Electron 的 fs 能直接读 asar，
        # 普通 Node 不能，所以 ZIP 仍然是给外部 Node 用的那一份。
        # asar 自身不压缩（约 400 MiB / 平台），外面套一层 zip 后上传体积才回到 ~140 MiB。
        # 用 pnpm dlx 而不是 devDependency：本 job 只安装 upstream 的依赖，
        # 且这一版 dsh 可能还没发布到 npm，装不了本仓库的依赖。
        run: |
          set -euo pipefail
          asar="${MATRIX_ARTIFACT%.zip}.asar"
          # 平台验证步骤会往 build_dir 写 dsh-web-help.txt；ZIP 不装它，asar 也保持一致。
          rm -f upstream/build_dir/dsh-web-help.txt
          pnpm dlx @electron/asar@4.3.1 pack upstream/build_dir "$asar"
          # asar list 在 Windows 上打印反斜杠路径，先归一化再断言入口文件在里面。
          # 不用 grep -q：它匹配到就退出，tr 写 stdout 收到 SIGPIPE，pipefail 下整步失败。
          pnpm dlx @electron/asar@4.3.1 list "$asar" | tr '\\' '/' | grep -F '/node_modules/@deepseek-ai/dsh/lib/bin.js' > /dev/null
          case "${{ matrix.os }}" in
            windows-*) 7z a "$asar.zip" "$asar" > /dev/null ;;
            *) zip -q -r "$asar.zip" "$asar" ;;
          esac
          rm -f "$asar"
          ls -lh "$asar.zip"
        env:
          MATRIX_ARTIFACT: ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            *.asar.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    # 上传通道退化时 step 会挂着不动（见 release.yml 顶部说明）。旧配置没有超时，
    # 卡住的上传会一直占着 runner 直到 6 小时默认上限，白烧额度。
    timeout-minutes: 20
    env:
      TAG: dsh-src-${{ inputs.dsh_version || github.event.inputs.dsh_version }}-${{ github.run_id }}
      DSH_VERSION: ${{ inputs.dsh_version || github.event.inputs.dsh_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Report artifact sizes
        # 只报告、不拦截（原因见 release.yml 的 "Report artifact sizes"）。脚本失败
        # 同样不阻断发布，只降级为 warning 注解。
        run: node scripts/check-artifact-size.mjs --dir=./artifacts || echo "::warning::artifact size report failed; see log above"

      - name: Delete stale drafts for this version
        # 上一次尝试失败会留下半成品 draft；draft 没有 git ref，既不会被
        # `gh release list --exclude-pre-releases` 看到，也无法用 tag 查到，
        # 必须先清掉，重跑才干净。
        run: node scripts/delete-stale-drafts.mjs --prefix="dsh-src-${DSH_VERSION}-"

      - name: Create GitHub pre-release
        run: |
          set -euo pipefail
          # 不指定 --target，保持与 softprops/action-gh-release 一致的行为
          # （新 tag 落在仓库默认分支上）。tag 一律新建：本次 run 的 tag 尚未
          # 创建，历史 draft 已被上一步删除，所以这里的 tag 不会冲突。
          release_url="$(gh release create "$TAG" \
            --title "Pre-release-dsh-${DSH_VERSION}" \
            --prerelease \
            --notes "$(printf '%s\n' \
              '# DeepSeek Harness source pre-release' \
              "- Version: ${DSH_VERSION}" \
              "- Build ID: ${GITHUB_RUN_ID}" \
              '- Built from upstream GitHub Release source because npm did not yet publish this version.' \
              '- 使用说明见仓库 README.md')")"
          echo "created pre-release: $release_url"
          {
            echo "### Published pre-release"
            echo
            echo "$release_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assets one by one with retry
        # 串行上传 + 逐包重试，替代 softprops/action-gh-release 的并发上传
        # （该 action 用 Promise.all 同时传全部资产并把每个文件整体读进内存，
        # softprops/action-gh-release#243；4 条连接平分退化带宽更容易整体超时，
        # 失败后也无法逐包续传）。`gh release upload` 是流式单连接上传，
        # --clobber 允许重跑覆盖。
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(./artifacts/**/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no assets found under ./artifacts; refusing to publish an empty release" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            attempt=1
            max_attempts=4
            until gh release upload "$TAG" "$asset" --clobber; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "upload failed after ${max_attempts} attempts: $asset" >&2
                exit 1
              fi
              delay=$((15 * attempt))
              echo "upload failed for $asset (attempt ${attempt}/${max_attempts}), retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
            echo "uploaded $asset"
          done

      - name: Verify release assets
        # 显式确认十二个包都在，避免发布出残缺 pre-release。
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.size)  \(.name)"'
          count="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          expected=12
          if [ "$count" -lt "$expected" ]; then
            echo "expected ${expected} assets on ${TAG}, found ${count}" >&2
            exit 1
          fi
          echo "pre-release ${TAG} is complete"
