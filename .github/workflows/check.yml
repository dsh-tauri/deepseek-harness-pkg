name: Packaging checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest]
        node: [22.22.0, 24.21.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned native loader
        run: npm install --prefix native-runtime --no-audit --no-fund node-addon-require-builtin@0.1.9
      - name: Verify native internal module access
        run: node scripts/check-native-runtime.mjs native-runtime
      - name: Install desktop Electron runtime
        if: matrix.node == '24.21.0'
        run: npm install --prefix native-runtime --no-audit --no-fund electron@44.7.0
      - name: Verify Electron native internal module access
        if: matrix.node == '24.21.0'
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: node native-runtime/node_modules/electron/cli.js scripts/check-native-runtime.mjs native-runtime
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Run regression tests
        run: node --test scripts/*.test.mjs
      - name: Check workflow structure and shell syntax
        run: node scripts/check-workflows.mjs
